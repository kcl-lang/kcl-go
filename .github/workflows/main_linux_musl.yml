name: build-and-test-linux-musl
on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"
jobs:
  build-and-test:
    # Ref: https://github.com/actions/runner-images/tree/main/images/macos
    strategy:
      matrix:
        include:
          # Alpine Linux container configurations
          #
          # The image is pinned to the last Go 1.26 release before 1.26.11,
          # which added a check that rejects any archive referenced by a
          # #cgo LDFLAGS whose members carry embedded LLVM bitcode. The musl
          # staticlib of kcl-lang.io/lib still carries it, so the floating
          # tag turned this job red on 2026-11-07, independently of any
          # change in this repository.
          #
          # Unpin it when kcl-lang.io/lib ships a staticlib without the
          # bitcode (kcl-lang/kcl#2268) or when Go 1.26.12 backports the
          # check away (golang.org/issue/83126).
          - os: alpine-latest
            runner: ubuntu-latest  # Host runner for the container
            container: golang:1.26.10-alpine
            cgo_enabled: 1

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install musl dependencies (Alpine container)
        run: |
          apk add --no-cache \
            musl-dev \
            gcc \
            git \
            make

      - name: Setup build tags for Alpine
        run: |
          echo "GO_BUILD_TAGS=musl netgo static osusergo" >> $GITHUB_ENV
          echo "GO_LDFLAGS=-linkmode external -extldflags '-static'" >> $GITHUB_ENV

      - name: Go code test
        run: |
          BUILD_TAGS="$GO_BUILD_TAGS"
          EXTRA_LDFLAGS="$GO_LDFLAGS"

          CGO_ENABLED=${{ matrix.cgo_enabled }} \
          go test ./... -v \
            -tags="${BUILD_TAGS}" \
            -ldflags="${EXTRA_LDFLAGS}"
        env:
          CGO_LDFLAGS: ${{ matrix.cgo_enabled == '1' && '-static' || '' }}
